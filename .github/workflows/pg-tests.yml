name: tests

# Runs the Python regression suite on GitHub-hosted runners.
#
# Every workflow this repository inherited from upstream Neon lives in
# .github/workflows-disabled/ and no longer runs: they depend on Neon's
# self-hosted runners, their container registries and their cloud accounts,
# none of which exist for this fork. This is the one workflow that does run,
# and it only needs github-hosted machines.
#
# Two things worth knowing if you change this file:
#
#  * Build with `--features testing`. Without it the pageserver has no
#    failpoints, and 274 of the ~840 tests skip themselves with "pageserver was
#    built without 'testing' feature" -- including test_pg_regress and
#    test_isolation. A green run without this flag means much less than it looks.
#
#  * The suite is sharded across parallel jobs. It is not that any one test is
#    slow, it is that there are a lot of them and each spins up a pageserver, a
#    safekeeper and a compute. One build job feeds all the shards so the
#    (expensive) Postgres + Rust build happens once.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      pg_version:
        description: PostgreSQL major version to test
        required: false
        default: v18
        type: choice
        options: [ v14, v15, v16, v17, v18 ]
      shards:
        description: Number of parallel test shards
        required: false
        default: "10"
        type: string

concurrency:
  # Keyed by version as well as ref, so that dispatching a v17 run to compare
  # against does not cancel the v18 run you are comparing it with. Deciding
  # whether a failure is v18-specific means running both.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.pg_version || 'v18' }}
  cancel-in-progress: true

# As the upstream workflows do. Without this, `run:` steps in a container job get
# /bin/sh, which on bookworm is dash: no arrays, no process substitution. pipefail
# also matters here, since several steps end in a pipe whose first command is the
# one that can fail.
defaults:
  run:
    shell: bash -euxo pipefail {0}

# Nothing here publishes anything. Keep the token read-only; the disabled
# upstream workflows asked for packages:write, which a fork cannot grant unless
# the repository's default workflow permissions are raised.
permissions:
  contents: read

env:
  PG_VERSION: ${{ inputs.pg_version || 'v18' }}
  BUILD_TYPE: debug
  # Upstream's _build-and-test-locally.yml used "testing,rest_broker". The
  # rest_broker half cannot build in this fork: it needs subzero-core, and
  # libs/proxy/subzero_core is a stub ("This is a stub for the subzero-core
  # crate"), so proxy fails with unresolved imports of subzero_core::{api,
  # config, error, dynamic_statement}. Nothing in test_runner/regress needs it.
  CARGO_FEATURES: testing
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: build ${{ inputs.pg_version || 'v18' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/neondatabase/build-tools:pinned-bookworm
      # --init so that PID 1 reaps. Without a reaper, neon_local's children
      # become zombies when it stops them, kill(pid, 0) keeps succeeding for a
      # zombie, and every test teardown fails with
      # "<name> with pid N did not stop in 10s" despite the process having exited.
      options: --init --user root
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the Postgres submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # postgres_ffi generates bindings for every supported version, so the
          # headers for all of them are needed even when testing just one.
          git submodule update --init --depth 1 --recursive

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ env.PG_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.PG_VERSION }}-
            cargo-${{ runner.os }}-

      - name: Cache the Postgres build
        uses: actions/cache@v4
        with:
          path: |
            pg_install
            build
          # The -v2 busts a poisoned entry: a cache key is never overwritten once
          # it exists, so a half-written tree in there is served forever.
          key: pg-${{ runner.os }}-${{ env.PG_VERSION }}-v2-${{ hashFiles('vendor/revisions.json') }}

      - name: Build Postgres and the Neon extensions
        run: |
          # Postgres builds its objfiles.txt with `( cat ... ) > objfiles.txt`,
          # and /bin/sh exits 2 when that redirection fails -- which make reports
          # as a bare "Error 2" with no message at all. Disk exhaustion looks
          # exactly like that, so record the free space rather than guess later.
          df -h . /tmp
          # A restored cache can hold a half-written build tree. That does not
          # announce itself: a truncated .deps/*.Po file makes make stop with
          #
          #     .deps/multirangetypes.Po:218: *** missing separator.  Stop.
          #
          # which looks like a Postgres problem, not a cache problem. Only trust
          # the tree if the marker written by a completed build is there.
          if [ ! -f "build/.complete-${PG_VERSION}" ]; then
            echo "no completion marker for ${PG_VERSION}: discarding any restored tree"
            rm -rf "build/${PG_VERSION}" "pg_install/${PG_VERSION}"
          fi
          make -j"$(nproc)" postgres-install-"${PG_VERSION}"
          make -j"$(nproc)" neon-pg-ext-"${PG_VERSION}"
          mkdir -p build && touch "build/.complete-${PG_VERSION}"
          df -h .

      - name: Build the Neon binaries
        run: |
          make -j"$(nproc)" neon \
            CARGO_BUILD_FLAGS="--locked --features ${CARGO_FEATURES}"
          # Fail loudly rather than skipping 274 tests at run time.
          ./target/debug/pageserver --version | tee /dev/stderr | grep -q '"testing"'

      - name: Plan the test shards
        id: plan
        run: |
          # test_pg_regress.py gets a shard to itself ("regress"). It is a dozen
          # heavy parametrisations that per-file sharding cannot split, and
          # bundled with an ordinary shard's worth of files it ran past even a
          # two-hour budget -- killed inside test_isolation, with pg_regress
          # itself having taken the first hour.
          n="${{ inputs.shards || '10' }}"
          echo "shards=$(python3 -c "import json;print(json.dumps(list(range(1,$n+1))+['regress']))")" >> "$GITHUB_OUTPUT"

      - name: Package what the test jobs need
        run: |
          # Straight from the build tree, with no staging copy: these are debug
          # binaries, several GB in total, and copying them doubled the peak disk
          # for no benefit. Paths inside the archive stay relative to the
          # workspace, which is where the test job unpacks them.
          #
          # Every executable cargo produced, not a hand-written list -- the list
          # this replaced omitted proxy, local_proxy, pg_sni_router and
          # test_helper_slow_client_reads, so the tests that invoke those by path
          # failed with FileNotFoundError and nothing implicating the packaging.
          {
            # pg_regress and isolationtester are run out of the build tree.
            printf '%s\0' pg_install "build/${PG_VERSION}"
            find target/debug -maxdepth 1 -type f -executable -print0
          } > /tmp/pkg-list
          echo "packaging $(tr -cd '\0' < /tmp/pkg-list | wc -c) paths, of which binaries:"
          find target/debug -maxdepth 1 -type f -executable -printf '  %f\n' | sort
          tar --null -T /tmp/pkg-list -cf - | zstd -T0 -3 -o neon-build.tar.zst
          ls -lh neon-build.tar.zst
          df -h .

      - uses: actions/upload-artifact@v4
        with:
          name: neon-build
          path: neon-build.tar.zst
          retention-days: 3
          compression-level: 0

  test:
    name: test ${{ inputs.pg_version || 'v18' }} (shard ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    # A hung shard otherwise runs to GitHub's 6-hour default and then has its
    # logs discarded ("BlobNotFound"), so it costs six hours and tells you
    # nothing.
    #
    # Most shards take 25-45 minutes. The one holding test_pg_regress.py is the
    # long pole and needs roughly twice that: it is a dozen heavy
    # parametrisations (pg_regress, isolation and sql_regress, each over two
    # protocol versions and two shard counts) and sharding is per-file, so they
    # cannot be spread out. 75 minutes killed it mid-run.
    timeout-minutes: 120
    container:
      image: ghcr.io/neondatabase/build-tools:pinned-bookworm
      # --user root because a GitHub-hosted runner's workspace is not writable by
      # the image's own uid, and actions/checkout would fail. Postgres refuses to
      # run as root, so the steps that start one drop back to nonroot -- see the
      # chown step below.
      #
      # --shm-size and --ulimit as upstream's _build-and-test-locally.yml sets
      # them: docker's default 64MB /dev/shm is not enough for the parallel
      # workers' dynamic shared memory, and tokio-epoll-uring accounts its rings
      # against the locked-memory limit.
      options: --init --user root --shm-size=512mb --ulimit memlock=67108864:67108864
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the Postgres submodule under test
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # test_pg_regress and test_isolation read their schedules and expected
          # output straight out of the Postgres source tree.
          git submodule update --init --depth 1 "vendor/postgres-${PG_VERSION}"

      - uses: actions/download-artifact@v4
        with:
          name: neon-build

      - name: Unpack the build
        run: |
          zstd -d -c neon-build.tar.zst | tar -xf -
          chmod +x target/debug/*

      - name: Hand the workspace to nonroot
        run: |
          # Everything above ran as root, so the tree is root-owned. initdb and
          # pg_ctl refuse to run as root ("cannot be run as root ... log in as the
          # unprivileged user that will own the server process"), and the suite
          # starts a compute per test, so the remaining steps run as nonroot --
          # the uid this image is built around, with pyenv and cargo already on
          # its PATH.
          chown -R nonroot:nonroot "$GITHUB_WORKSPACE"
          runuser -u nonroot -- git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install the Python test dependencies
        run: |
          # HOME too: poetry caches its virtualenv there, and root's is not
          # readable by nonroot in the step that follows.
          runuser -u nonroot -- env HOME=/home/nonroot PATH="$PATH" ./scripts/pysync

      - name: Run the regression suite
        env:
          NEON_BIN: ${{ github.workspace }}/target/debug
          POSTGRES_DISTRIB_DIR: ${{ github.workspace }}/pg_install
          TEST_OUTPUT: ${{ github.workspace }}/test_output
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards || '10' }}
        run: |
          # DEFAULT_PG_VERSION wants the bare major number, PG_VERSION is v-prefixed.
          export DEFAULT_PG_VERSION="${PG_VERSION#v}"
          export LD_LIBRARY_PATH="${POSTGRES_DISTRIB_DIR}/${PG_VERSION}/lib"
          # Owned by nonroot: this step still runs as root, but the suite writes
          # here as nonroot.
          install -d -o nonroot -g nonroot "$TEST_OUTPUT"
          # The "regress" shard runs test_pg_regress.py and nothing else. What it
          # buys is a budget of its own, not more parallelism: at four workers
          # every test_pg_regress parametrisation hit its own 3000s timeout,
          # because each one drives Postgres's regression schedule, which is
          # itself parallel and CPU-bound. Four of those on four vCPUs is worse
          # oversubscription than the arrangement it replaced, not better.
          #
          # Everything else is a deterministic round-robin over the remaining
          # files, so a shard always covers the same set and a failure can be
          # reproduced by re-running that shard alone.
          if [ "$SHARD" = "regress" ]; then
            FILES=(test_runner/regress/test_pg_regress.py)
            WORKERS=2
          else
            mapfile -t FILES < <(printf '%s\n' test_runner/regress/test_*.py \
              | grep -v '/test_pg_regress\.py$' | sort | awk "NR % $SHARDS == $SHARD % $SHARDS")
            WORKERS=2
          fi
          # An empty list would make pytest collect the whole suite in this shard
          # rather than fail, so check instead of trusting the glob.
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "shard $SHARD/$SHARDS matched no test files" >&2
            exit 1
          fi
          echo "shard $SHARD/$SHARDS covers ${#FILES[@]} files"
          printf '  %s\n' "${FILES[@]}"
          # --timeout: a test that needs longer than this is a finding in itself,
          # and waiting on it just idles a worker.
          # Two workers, not $(nproc). A github-hosted runner has 4 vCPUs, and
          # every test starts a pageserver, a safekeeper, a broker, a storage
          # controller and a compute -- so one worker per core oversubscribes it
          # several times over. That shows up as timing failures rather than as
          # slowness: endpoints that do not shut down within neon_local's grace
          # period, then `endpoint start` failing with "Directory not empty"
          # because the old compute is still writing into pgdata while it is
          # being removed.
          runuser -u nonroot -- env HOME=/home/nonroot PATH="$PATH" \
            DEFAULT_PG_VERSION="$DEFAULT_PG_VERSION" LD_LIBRARY_PATH="$LD_LIBRARY_PATH" \
            ./scripts/pytest \
              -v -rf \
              -p no:cacheprovider \
              -n "$WORKERS" --dist=loadgroup \
              --timeout=600 \
              --junit-xml="${TEST_OUTPUT}/junit-shard-${SHARD}.xml" \
              "${FILES[@]}"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-shard-${{ matrix.shard }}
          path: |
            test_output/junit-*.xml
          retention-days: 14
          if-no-files-found: warn

      # Without this a failure is only as diagnosable as whatever pytest chose to
      # print: the interesting part -- the compute's log, the pageserver's log,
      # the stderr of a pg_bin command that exited non-zero -- is written to
      # files under test_output and thrown away with the runner.
      - name: Collect the logs of a failed run
        # always(), not failure(): a shard killed by timeout-minutes is
        # "cancelled", and failure() would skip it -- losing the logs of the one
        # run whose logs are most wanted.
        if: always()
        run: |
          find test_output \
            \( -name '*.log' -o -name '*.stderr' -o -name '*.stdout' \
               -o -name 'regression.diffs' -o -name 'regression.out' \) \
            -size -20M -print0 | tar --null -T - -czf test-logs.tar.gz || true
          ls -lh test-logs.tar.gz || true

      - name: Upload the logs of a failed run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-shard-${{ matrix.shard }}
          path: test-logs.tar.gz
          retention-days: 14
          if-no-files-found: warn

  report:
    name: report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: test-results-shard-*
          merge-multiple: true
          path: results

      - name: Summarise
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          tot = {"passed": 0, "failed": 0, "error": 0, "skipped": 0}
          bad = []
          for fn in sorted(glob.glob("results/**/junit-*.xml", recursive=True)):
              root = ET.parse(fn).getroot()
              ts = root if root.tag == "testsuite" else root[0]
              for tc in ts:
                  kinds = [c.tag for c in tc]
                  if "failure" in kinds:
                      tot["failed"] += 1; bad.append(("FAIL", tc.get("name", "")))
                  elif "error" in kinds:
                      tot["error"] += 1; bad.append(("ERROR", tc.get("name", "")))
                  elif "skipped" in kinds:
                      tot["skipped"] += 1
                  else:
                      tot["passed"] += 1
          print("## Test results\n")
          print("| result | count |\n|---|---|")
          for k, v in tot.items():
              print(f"| {k} | {v} |")
          if bad:
              print(f"\n### Failures ({len(bad)})\n")
              for kind, name in bad[:100]:
                  print(f"- `{kind}` {name}")
              if len(bad) > 100:
                  print(f"\n...and {len(bad) - 100} more.")
          PY

      # `if: always()` means this job also runs when the shards were cancelled or
      # died before uploading anything -- in which case the check below sees no
      # results, counts no failures and passes. A run where nothing executed must
      # not report success, so take the shards' own conclusion first.
      - name: Fail if the shards did not all succeed
        if: needs.test.result != 'success'
        run: |
          echo "test jobs concluded: ${{ needs.test.result }}"
          exit 1

      - name: Fail if any test failed
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob("results/**/junit-*.xml", recursive=True)
          if not files:
              sys.exit("no junit files: the shards produced no results at all")
          bad = total = 0
          for fn in files:
              root = ET.parse(fn).getroot()
              ts = root if root.tag == "testsuite" else root[0]
              for tc in ts:
                  total += 1
                  bad += sum(1 for c in tc if c.tag in ("failure", "error"))
          print(f"{bad} failing tests out of {total}, from {len(files)} shards")
          sys.exit(1 if bad else 0)
          PY
